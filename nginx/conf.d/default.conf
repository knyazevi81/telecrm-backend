server {
    listen 80;
    server_name tele.savebit.ru www.tele.savebit.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # location / {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tele.savebit.ru www.tele.savebit.ru;

    ssl_certificate /etc/letsencrypt/live/tele.savebit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tele.savebit.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Proxy API calls to backend
    # location /api {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Keycloak is served under /kc/ — forward to Keycloak container (port 8080)
    # ensure trailing slashes so upstream sees correct path
    location = /kc {
        return 302 /kc/;
    }

    location /kc/ {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # tell Keycloak it's mounted under /kc
        proxy_set_header X-Forwarded-Prefix /kc;
    }

    # Default: proxy root and other frontend traffic to backend
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}